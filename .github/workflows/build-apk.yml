name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Installa i pacchetti giusti per compileSdk 34. Va evitato il
          # pacchetto obsoleto "tools" (default dell'azione), rimosso da Google:
          # causa "Failed to find package 'tools'" e blocca il build.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: registratore-lezioni-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Pubblica l'APK come asset di una Release, così è scaricabile con un
      # link diretto al file (niente zip da estrarre). Link stabile:
      # https://github.com/<owner>/<repo>/releases/download/apk-latest/app-debug.apk
      - name: Pubblica APK come Release (link diretto)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apk-latest \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "APK piu recente" \
            --notes "Ultimo APK compilato automaticamente dal branch ${{ github.ref_name }}." \
          || gh release upload apk-latest \
            app/build/outputs/apk/debug/app-debug.apk --clobber
