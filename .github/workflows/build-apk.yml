name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Installa i pacchetti giusti per compileSdk 34. Va evitato il
          # pacchetto obsoleto "tools" (default dell'azione), rimosso da Google:
          # causa "Failed to find package 'tools'" e blocca il build.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: registratore-lezioni-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
