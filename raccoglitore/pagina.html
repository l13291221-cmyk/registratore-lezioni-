<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raccoglitore Email Scuole</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#5b6470; --box:#fff; --line:#d5dae0; --acc:#1f6feb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171b; --fg:#e8ebef; --muted:#9aa4b0; --box:#1d2127; --line:#353c45; --acc:#5b9dff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 20px; font-size:.9rem; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input { width:100%; font-size:1.6rem; padding:12px; border:1px solid var(--line);
          border-radius:10px; background:var(--box); color:var(--fg); }
  textarea { width:100%; height:50vh; margin-top:16px; padding:12px; font:14px/1.5 ui-monospace, monospace;
             border:1px solid var(--line); border-radius:10px; background:var(--box); color:var(--fg); }
  #info { margin-top:8px; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Email scuole superiori – Emilia-Romagna</h1>
  <p>Fonte: open data Ministero dell'Istruzione (statali e paritarie), aggiornati il {{AGGIORNATO}}.</p>
  <label for="n">Quante email?</label>
  <input id="n" type="number" min="1" inputmode="numeric" placeholder="es. 50" autofocus>
  <div id="info"></div>
  <textarea id="out" readonly placeholder="Le email compaiono qui, una per riga"></textarea>
</main>
<script>
const SCUOLE = /*DATI*/[];
const n = document.getElementById("n"), out = document.getElementById("out"), info = document.getElementById("info");
info.textContent = "Disponibili: " + SCUOLE.length;
n.addEventListener("input", () => {
  const q = Math.min(Math.max(parseInt(n.value, 10) || 0, 0), SCUOLE.length);
  out.value = SCUOLE.slice(0, q).map(s => s.email).join("\n");
  info.textContent = q ? q + " di " + SCUOLE.length + " – tieni premuto sul riquadro per copiarle"
                       : "Disponibili: " + SCUOLE.length;
});
out.addEventListener("focus", () => out.select());
</script>
</body>
</html>
